name: Publish Update (version bump + rebuild)

# Bumps version.json and rebuilds the release tarballs with that exact
# version baked in, in a single commit/PR. This exists because doing it as
# two separate steps (bump version.json, then let auto-build.yml rebuild on
# a later, unrelated push) leaves a window where an already-merged rebuild
# reflects an older version.json than what's live, so the binary a user
# downloads self-reports the wrong version and the update banner never
# clears. Run this manually whenever you're ready to ship a new version to
# installed instances.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version, e.g. v1.1.13. Leave empty to auto-increment the patch number.'
        required: false
        type: string
      announcement:
        description: 'Spanish announcement shown in the update banner'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine and write version.json
        id: version
        env:
          NEW_VERSION: ${{ inputs.version }}
          NEW_ANNOUNCEMENT: ${{ inputs.announcement }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re

          with open("version.json") as f:
              data = json.load(f)

          new_version = os.environ.get("NEW_VERSION", "").strip()
          if not new_version:
              current = data["version"]
              m = re.match(r"^(v\d+\.\d+\.)(\d+)$", current)
              if not m:
                  raise SystemExit(
                      f"cannot auto-increment version {current!r}: expected vMAJOR.MINOR.PATCH"
                  )
              new_version = f"{m.group(1)}{int(m.group(2)) + 1}"
              print(f"::notice::No version given, auto-incrementing {current} -> {new_version}")
          else:
              print(f"::notice::Using given version {new_version}")

          data["version"] = new_version
          data["announcement"] = os.environ["NEW_ANNOUNCEMENT"]

          with open("version.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
          PYEOF

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build Static Frontend & Re-generate Archives
        run: |
          cd client
          npm ci
          npm run build-prod
          cd ..

          # Bake the same version we just wrote to version.json into the
          # binary, so the running instance reports the version it was told
          # to update to (otherwise the update banner never goes away, since
          # it compares this string against version.json).
          version_pkg='github.com/AdguardTeam/AdGuardHome/internal/version'
          version=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          ldflags="-X ${version_pkg}.version=${version}"

          go build -ldflags "$ldflags" -o AdGuardHome main.go
          GOOS=freebsd GOARCH=amd64 go build -ldflags "$ldflags" -o AdGuardHome_freebsd_amd64 main.go

          rm -rf tmp_pkg
          mkdir -p tmp_pkg/AdGuardHome
          cp AdGuardHome tmp_pkg/AdGuardHome/AdGuardHome
          cd tmp_pkg && tar -czvf ../AdGuardHome_linux_amd64.tar.gz AdGuardHome && cd ..

          rm -rf tmp_pkg
          mkdir -p tmp_pkg/AdGuardHome
          cp AdGuardHome_freebsd_amd64 tmp_pkg/AdGuardHome/AdGuardHome
          cd tmp_pkg && tar -czvf ../AdGuardHome_freebsd_amd64.tar.gz AdGuardHome && cd ..
          rm -rf tmp_pkg

      - name: Commit version bump and rebuilt tarballs together
        id: commit
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add version.json AdGuardHome_linux_amd64.tar.gz AdGuardHome_freebsd_amd64.tar.gz

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="publish-update-${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "release: Publish ${NEW_VERSION}"
          git push origin "$BRANCH" --force

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # master is a protected branch (PR + review required), so this can't
      # push there directly. Land the version bump and the matching rebuilt
      # tarballs on one branch and open one PR instead, for manual review
      # and merge -- merging it alone brings the repo to a fully consistent
      # state, with nothing else left to merge afterward.
      - name: Open Pull Request for Manual Review
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "release: Publish ${NEW_VERSION}" \
            --body "Bumps version.json to ${NEW_VERSION} and rebuilds both release tarballs with that version baked in, as a single change. Review and merge manually." \
            || echo "PR may already exist for this branch."
