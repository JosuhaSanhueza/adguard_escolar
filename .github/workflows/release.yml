name: Release AdGuard Home Custom Fork

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install Frontend Dependencies & Build Static Assets
        run: |
          cd client
          npm ci
          npm run build-prod

      - name: Build Executable Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 go build -o AdGuardHome_linux_amd64 main.go
          tar -czvf AdGuardHome_linux_amd64.tar.gz AdGuardHome_linux_amd64

      - name: Build Executable FreeBSD AMD64 (OPNsense)
        run: |
          GOOS=freebsd GOARCH=amd64 go build -o AdGuardHome_freebsd_amd64 main.go
          tar -czvf AdGuardHome_freebsd_amd64.tar.gz AdGuardHome_freebsd_amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AdGuardHome_linux_amd64.tar.gz
            AdGuardHome_freebsd_amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
