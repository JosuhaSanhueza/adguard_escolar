name: Auto Build Packages on Push

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'AdGuardHome_linux_amd64.tar.gz'
      - 'AdGuardHome_freebsd_amd64.tar.gz'
      - 'README.md'
      - '.github/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build Static Frontend & Re-generate Archives
        run: |
          cd client
          npm ci
          npm run build-prod
          cd ..

          # Bake version.json's version into the binary, so the running
          # instance reports the same version it was told to update to
          # (otherwise the update banner never goes away, since it compares
          # this string against version.json).
          version_pkg='github.com/AdguardTeam/AdGuardHome/internal/version'
          version=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          ldflags="-X ${version_pkg}.version=${version}"

          go build -ldflags "$ldflags" -o AdGuardHome main.go
          GOOS=freebsd GOARCH=amd64 go build -ldflags "$ldflags" -o AdGuardHome_freebsd_amd64 main.go

          rm -rf tmp_pkg
          mkdir -p tmp_pkg/AdGuardHome
          cp AdGuardHome tmp_pkg/AdGuardHome/AdGuardHome
          cd tmp_pkg && tar -czvf ../AdGuardHome_linux_amd64.tar.gz AdGuardHome && cd ..
          
          rm -rf tmp_pkg
          mkdir -p tmp_pkg/AdGuardHome
          cp AdGuardHome_freebsd_amd64 tmp_pkg/AdGuardHome/AdGuardHome
          cd tmp_pkg && tar -czvf ../AdGuardHome_freebsd_amd64.tar.gz AdGuardHome && cd ..
          rm -rf tmp_pkg

      - name: Commit Updated Tarballs to Branch
        id: commit
        run: |
          git add AdGuardHome_linux_amd64.tar.gz AdGuardHome_freebsd_amd64.tar.gz version.json internal/version/version.go

          if git diff --cached --quiet; then
            echo "Nothing changed, skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="auto-build-update"
          git checkout -b "$BRANCH"
          git commit -m "build(release): Auto-rebuild release packages [skip ci]"
          git push origin "$BRANCH" --force

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # master is a protected branch (PR + review required), so the rebuilt
      # tarballs can't be pushed there directly. Land them on a branch and
      # open a PR instead, for manual review and merge.
      - name: Open Pull Request for Manual Review
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "build(release): Auto-rebuild release packages" \
            --body "Automated tarball rebuild after a push to master. Review and merge manually." \
            || echo "PR may already exist for this branch."
